name: searchforge

x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-development}
  POSTGRES_URL: ${POSTGRES_URL:-postgresql://searchforge:searchforge@postgres:5432/searchforge}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-searchforge}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-searchforge-local}
  MINIO_BUCKET: ${MINIO_BUCKET:-searchforge}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: searchforge
      POSTGRES_USER: searchforge
      POSTGRES_PASSWORD: searchforge
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U searchforge"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-searchforge}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-searchforge-local}
    ports: ["9001:9001"]
    volumes: [minio_data:/data]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *app-env
      PORT: 4000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10

  crawler:
    build:
      context: .
      dockerfile: apps/crawler/Dockerfile
    environment:
      <<: *app-env
      CRAWLER_USER_AGENT: ${CRAWLER_USER_AGENT:-SearchForgeBot/1.0}
      CRAWLER_ALLOW_PRIVATE_NETWORKS: ${CRAWLER_ALLOW_PRIVATE_NETWORKS:-false}
    depends_on:
      redis: { condition: service_healthy }

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      <<: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: ${API_ORIGIN:-http://localhost:4000}
    depends_on:
      api: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:latest
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes: [grafana_data:/var/lib/grafana]
    ports: ["3001:3000"]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
  grafana_data:
